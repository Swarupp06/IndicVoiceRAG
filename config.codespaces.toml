# Codespaces deployment config for the HH Goa 2026 Task 2 public demo.
# Select it with:  INDICVOICERAG_CONFIG=config.codespaces.toml
#
# Production components (no mock, no local whisper):
#   - Persisted FAISS index: indexes/goa_pilot/goa.index + goa.metadata.jsonl
#   - Embeddings: intfloat/multilingual-e5-small (PyTorch, CPU)
#   - LLM:        Groq llama-3.1-8b-instant (GROQ_API_KEY)
#   - STT:        Sarvam (saaras:v3 is hardcoded in stt.py; SARVAM_API_KEY)
#   - TTS:        MMS Hindi (facebook/mms-tts-hin, local CPU)
#
# API keys are read ONLY from environment variables (Codespaces secrets).
# Never commit .env or any API key value. The generated Goa index lives in
# indexes/ which is gitignored and must be rebuilt in a fresh Codespace
# (see README "Codespaces deployment").

[dataset]
repo_id = "ai4bharat/MSMARCO-XI"
split = "validation"
config_name = "default"
streaming = true
sample_size = 128
language = "hin"
revision = "main"
allow_insecure_ssl = false
local_sample_path = ""
sample_cache_path = ""
cache_dir = ".cache/hf"
max_retries = 3

[chunking]
strategy = "fixed"
chunk_size = 120
overlap = 20
semantic_threshold = 0.35
sentence_separator_regex = "(?<=[.!?])\\s+"

[embedding]
provider = "sentence_transformers"
model_name = "intfloat/multilingual-e5-small"
dimension = 384
normalize = true

[vector]
provider = "faiss"
index_path = "indexes/goa_pilot/goa.index"
metadata_path = "indexes/goa_pilot/goa.metadata.jsonl"

[retrieval]
top_k = 3

[llm]
provider = "groq"
model_name = "llama-3.1-8b-instant"
base_url = ""
api_key_env = "GROQ_API_KEY"
temperature = 0.0
max_tokens = 512
timeout_seconds = 30.0
max_retries = 1
fallback_providers = []
fallback_models = {}
allow_mock_fallback = false

# Guardrail block preserved verbatim from config.groq.toml (Phase 2.6 settings).
[guardrails]
min_retrieval_score = 0.35
min_hits = 1
max_query_chars = 1000
grounding_threshold = 0.35
context_max_tokens = 1500
max_context_docs = 8
strict_retry_on_ungrounded = true
max_ungrounded_retries = 1

# Sarvam STT. The SarvamSTT provider hardcodes model "saaras:v3" (stt.py);
# no faster-whisper model_name is configured or passed to Sarvam here.
[stt]
provider = "sarvam"
api_key_env = "SARVAM_API_KEY"
language_code = "unknown"

[tts]
provider = "mms"
language = "hi"
cache_dir = ""