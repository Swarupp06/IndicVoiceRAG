[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indicvoicerag-phase1"
version = "0.1.0"
description = "IndicVoiceRAG Phase 1 dataset and retrieval foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=5.0.1",
  "httpx>=0.27.0",
  "huggingface-hub>=0.24.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8.0"]
stt = ["faster-whisper>=1.2.1"]
mic = ["sounddevice>=0.4.6"]
tts = ["transformers>=4.33"]
dev = ["pytest>=8.0.0"]

[project.scripts]
ivr = "indicvoicerag.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
