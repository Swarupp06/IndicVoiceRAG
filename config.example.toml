[dataset]
repo_id = "ai4bharat/MSMARCO-XI"
split = "validation"
config_name = "default"
streaming = true
sample_size = 128
language = "hin"
revision = "main"
allow_insecure_ssl = false
local_sample_path = "" # optional JSONL fallback for fully offline runs
sample_cache_path = "" # optional; defaults to data/msmarco_xi_<lang>_<split>_sample.jsonl
cache_dir = ".cache/hf"
max_retries = 3

[chunking]
strategy = "fixed" # fixed | sentence_aware | semantic
chunk_size = 120
overlap = 20
semantic_threshold = 0.35
sentence_separator_regex = "(?<=[.!?])\\s+"

[embedding]
provider = "sentence_transformers" # sentence_transformers | fastembed | hash
model_name = "intfloat/multilingual-e5-small" # or intfloat/multilingual-e5-base
dimension = 384
normalize = true

[vector]
provider = "faiss" # falls back to numpy if faiss unavailable
index_path = "indexes/dev.index"
metadata_path = "indexes/dev.metadata.jsonl"

[retrieval]
top_k = 5

# --- Phase 2.5: LLM provider (must stay at Rs 0) ---
# provider:
#   ollama            local inference, no API key, no cloud cost   (verified Rs 0)
#   gemini            Google Generative Language API, GEMINI_API_KEY     (free tier)
#   groq              GroqCloud OpenAI-compatible, GROQ_API_KEY          (free plan)
#   openrouter        OpenRouter, OPENROUTER_API_KEY, ":free" models only
#   openai_compatible generic endpoint - NOT ELIGIBLE for the Rs 0 project
#   mock              deterministic offline stub - TESTS ONLY
# API keys are never stored here, only the NAME of the env var that holds them.
[llm]
provider = "ollama"
model_name = "qwen2.5:1.5b-instruct"  # gemini-2.5-flash-lite / llama-3.1-8b-instant / google/gemma-4-31b-it:free
base_url = ""                         # endpoint override (ollama: http://localhost:11434)
api_key_env = ""                      # env var NAME only, e.g. GEMINI_API_KEY / GROQ_API_KEY / OPENROUTER_API_KEY
temperature = 0.0
max_tokens = 512
timeout_seconds = 30.0
max_retries = 1
# Ordered fallback chain: free cloud provider -> local ollama -> (mock, tests only).
fallback_providers = ["ollama"]
fallback_models = { ollama = "qwen2.5:1.5b-instruct" }
# Keep false outside tests: a demo must fail loudly rather than fake an answer.
allow_mock_fallback = false

# --- Phase 2: guardrails / context limits ---
[guardrails]
min_retrieval_score = 0.35    # below this, retrieval evidence is too weak to answer
min_hits = 1
max_query_chars = 1000
grounding_threshold = 0.35    # lexical grounding per-claim overlap threshold
context_max_tokens = 1500     # total context budget passed to the LLM
max_context_docs = 8          # max sources in the context
strict_retry_on_ungrounded = true
max_ungrounded_retries = 1

# --- Phase 3A: local speech-to-text (must stay at Rs 0) ---
# provider:
#   faster_whisper   local CTranslate2 whisper on CPU, no cloud cost
#   mock             deterministic offline stub - TESTS ONLY
[stt]
provider = "faster_whisper"
model_name = "small"          # Phase 3B selection: smallest model with usable Hindi; tiny/base emit wrong script
device = "cpu"                # this machine has no GPU; keep cpu
compute_type = "int8"         # int8 (fast CPU) | int8_float32 | float32
language = ""                 # "" = auto-detect; set "en" / "hi" to pin
download_root = ".cache/stt"  # model cache dir (gitignored)
beam_size = 5
vad_filter = false            # Silero VAD pre-filtering (off by default)

# --- Phase 3C: microphone capture (push-to-talk, fixed duration) ---
[audio]
sample_rate = 16000           # captured PCM is resampled to 16 kHz mono
channels = 1
duration_seconds = 5.0        # fixed recording window per 'listen' invocation

# --- Phase 3D: local Indic text-to-speech (output layer) ---
[tts]
provider = "mms"              # mock | mms (Meta MMS-TTS VITS, local, CC-BY-NC 4.0)
language = "hi"               # baseline language; see tts.py for the Indic checkpoint table
cache_dir = ".cache/tts"      # model cache (gitignored)
