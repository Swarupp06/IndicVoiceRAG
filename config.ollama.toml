# Zero-cost local configuration used for the Phase 2.5 real RAG run and benchmark.
# Everything here runs on the machine itself: no API key, no billing, Rs 0.

[dataset]
repo_id = "ai4bharat/MSMARCO-XI"
split = "validation"
language = "hin"
sample_size = 800

[embedding]
provider = "sentence_transformers"
model_name = "intfloat/multilingual-e5-small"
dimension = 384
normalize = true

[vector]
provider = "faiss"
index_path = "indexes/dev.index"
metadata_path = "indexes/dev.metadata.jsonl"

[retrieval]
top_k = 5

[llm]
provider = "ollama"
model_name = "qwen2.5:1.5b-instruct"
base_url = "http://localhost:11434"
temperature = 0.0
# Short answers keep CPU-only generation latency bounded; RAG answers are 1-3 sentences.
max_tokens = 160
timeout_seconds = 120.0
max_retries = 1
fallback_providers = []
allow_mock_fallback = false

[guardrails]
min_retrieval_score = 0.35
min_hits = 1
grounding_threshold = 0.35
context_max_tokens = 1200
max_context_docs = 5
strict_retry_on_ungrounded = true
max_ungrounded_retries = 1
